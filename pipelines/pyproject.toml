[project]
name = "bitemporal-pipelines"
version = "0.0.0"
description = "Dagster assets, source adapters and the dbt project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "dagster>=1.9",
    "dagster-webserver>=1.13.16",
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]
