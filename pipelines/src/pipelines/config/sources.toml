# Registered external sources. Loaded into source_registry and read by the adapters.

[[source]]
source_id = "bse_bhavcopy_equity"
tier = 1
sebi_curation_ref = "Equity Cash Market, row 1"
base_url = "https://www.bseindia.com/download/BhavCopy/Equity/"
requests_per_second = 0.5
cache_policy = "permanent"
owner_notes = """
Serves a bare CSV to a plain client. No cookie or browser header required. The legacy file is
served zipped, the plain CSV covering only about the last two years, and a day the venue holds
nothing for is answered with the BSE home page under HTTP 200.
"""

# EQ_ISINCODE is served back to 8 December 2016, but the files for 8 and 9 December both carry
# the prices of 28 November, so the first day read is 12 December. TRADING_DATE appears on 23 June
# 2017, and a file without it is dated from the day it was asked for. The format runs to the
# Sunday before the UDiFF cutover, so every calendar day has a parser.
[[source.schema_version]]
version = "bse_legacy"
effective_from = 2016-12-12
effective_to = 2024-07-07

[[source.schema_version]]
version = "udiff"
effective_from = 2024-07-08

[[source]]
source_id = "nse_bhavcopy_equity"
tier = 1
sebi_curation_ref = "Equity Cash Market, row 1"
base_url = "https://nsearchives.nseindia.com/content/"
requests_per_second = 0.5
cache_policy = "permanent"
owner_notes = """
The archive host rejects a plain client. A browser User-Agent plus a cookie obtained from
nseindia.com is required, and the published ceiling is 3 requests per second.
"""

# Files run back to the 1990s, and ISIN and TOTALTRADES appear on 22 June 2011. A row before
# that names its instrument by ticker alone and cannot be keyed. The format runs to the Sunday
# before the UDiFF cutover, so every calendar day has a parser.
[[source.schema_version]]
version = "nse_legacy"
effective_from = 2011-06-22
effective_to = 2024-07-07

[[source.schema_version]]
version = "udiff"
effective_from = 2024-07-08

[[source]]
source_id = "bse_corporate_actions"
tier = 2
base_url = "https://api.bseindia.com/BseIndiaAPI/api"
requests_per_second = 0.2
cache_policy = "permanent"
owner_notes = """
The exchange's own endpoint, undocumented, answering a range of ex-dates with the actions of every
scrip code inside it. The venue's corporate action page asks it the same question, so a response
saved from that page is read from the cache like one fetched. A request carrying no Origin or
Referer is answered with a page rather than JSON.
Corporate announcements sit outside the SEBI equity cash market curation, so no row there names
it. The venue publishes no announcement date, so an action carries the day it was collected.
The edge answers 403 to an address that reads several thousand codes in a sitting at one request
every two seconds, and holds the refusal for more than a day.
"""

[[source.schema_version]]
version = "bse_actions_json"
effective_from = 1990-01-01

[[source]]
source_id = "nse_delivery"
tier = 1
sebi_curation_ref = "Equity Cash Market, row 2"
base_url = "https://nsearchives.nseindia.com"
requests_per_second = 0.5
cache_policy = "permanent"
owner_notes = """
Names an instrument by ticker and series, never by ISIN, so a row resolves through the listing in
force on its trade date. A series that settles no delivery reports a dash rather than a zero.
"""

# First served on 30 September 2019; the weekdays before it answer with nothing.
[[source.schema_version]]
version = "sec_bhavdata_full"
effective_from = 2019-09-30

[[source]]
source_id = "bse_delivery"
tier = 1
sebi_curation_ref = "Equity Cash Market, row 2"
base_url = "https://www.bseindia.com/BSEDATA/gross"
requests_per_second = 0.5
cache_policy = "permanent"
owner_notes = """
Pipe delimited text inside a zip, filed under the year and named by day and month alone. Scrip
codes and quantities are zero padded. A date the venue holds nothing for answers with the home
page carrying HTTP 200.
"""

[[source.schema_version]]
version = "scbseall"
effective_from = 2010-01-01
