version: 2

models:
  - name: mart_instruments
    description: >
      One row per instrument, under the name the application shows it by, with the ISIN it trades
      under now.
    columns:
      - name: isin
        data_type: varchar(12)
        description: Canonical instrument identifier.
      - name: name
        data_type: text
        description: The name the venue's price file printed, in its own capitals and abbreviations.
      - name: display_name
        data_type: text
        description: >
          The name the application shows: BSE's list of scrips, then NSE's list of equities, then
          either list's name for the ISIN the instrument trades under now, then the price file's.
      - name: instrument_type
        data_type: text
        description: What the instrument is, such as equity, etf or debt.
      - name: current_isin
        data_type: varchar(12)
        description: >
          The ISIN the instrument trades under now: itself, unless a change of face value issued
          another.

  - name: mart_listings
    description: >
      One row per stretch during which an instrument traded under one symbol at one venue. A rename
      or a change of ISIN closes a stretch and opens another.
    columns:
      - name: listing_id
        data_type: bigint
        description: Surrogate key of the stretch.
      - name: isin
        data_type: varchar(12)
        description: Canonical instrument identifier.
      - name: exchange
        data_type: varchar(12)
        description: BSE or NSE.
      - name: local_symbol
        data_type: text
        description: Ticker in force during the stretch. Venue-local, never a join key.
      - name: scrip_code
        data_type: text
        description: BSE's numeric identifier, which survives a rename and a change of ISIN.
      - name: listing_date
        data_type: date
        description: The first day of the stretch the stored history holds.
      - name: delisting_date
        data_type: date
        description: The last day of the stretch, absent while it remains open.
      - name: closure_reason
        data_type: text
        description: >
          Why the stretch closed: delisted, renamed, merged, or superseded where another ISIN took
          the instrument over under the same venue-local identifier at a change of face value.

  - name: mart_trading_days
    description: One verdict per venue and trading day, the latest reached.
    columns:
      - name: venue
        data_type: varchar(12)
        description: BSE or NSE.
      - name: trade_date
        data_type: date
        description: The day the verdict describes.
      - name: as_of_date
        data_type: date
        description: The day the verdict was reached.
      - name: is_complete
        data_type: boolean
        description: >
          Whether the day passed every check. An incomplete day feeds no ranking, breadth or alert.
      - name: bars
        data_type: integer
        description: How many bars the venue published.
      - name: divergent_instruments
        data_type: integer
        description: Instruments whose two venue closes disagreed beyond tolerance.
      - name: detail
        data_type: text
        description: What the day failed on, absent when it passed.

  - name: mart_sources
    description: Each source the platform's figures are read from, with its trust tier.
    columns:
      - name: source_id
        data_type: text
        description: The source's identifier, recorded beside every fact read from it.
      - name: tier
        data_type: smallint
        description: >
          1 for an exchange's bulk file, 2 for an exchange's web endpoint, 3 for a library wrapping
          either, 4 for any other site.
      - name: sebi_curation_ref
        data_type: text
        description: The SEBI curation row naming the source; absent for an endpoint no row lists.
      - name: base_url
        data_type: text
        description: Where the source is read from.

  - name: mart_price_daily
    description: >
      One bar per instrument, venue and trading day as the venue published it, the latest version
      known. Prices are as traded, so a bonus or split moves them; a series over time reads
      mart_adjusted_prices. Each bar is resolved from every version stored, so a read names its
      instruments and days.
    columns:
      - name: isin
        data_type: varchar(12)
        description: The ISIN the bar was published under.
      - name: venue
        data_type: varchar(12)
        description: BSE or NSE.
      - name: trade_date
        data_type: date
        description: The day the bar describes.
      - name: as_of_date
        data_type: date
        description: The day this version of the bar became knowable.
      - name: local_symbol
        data_type: text
        description: The ticker the venue printed on the bar.
      - name: scrip_code
        data_type: text
        description: BSE's numeric identifier printed on the bar.
      - name: open
        data_type: numeric(18,4)
        description: First traded price, in rupees.
      - name: high
        data_type: numeric(18,4)
        description: Highest traded price, in rupees.
      - name: low
        data_type: numeric(18,4)
        description: Lowest traded price, in rupees.
      - name: previous_close
        data_type: numeric(18,4)
        description: >
          The venue's own prior close, as traded, so on the ex-date of a bonus or split it differs
          from the adjusted close before it.
      - name: volume
        data_type: bigint
        description: Shares traded.
      - name: turnover
        data_type: numeric(20,2)
        description: Value traded, in rupees.
      - name: trade_count
        data_type: bigint
        description: Number of trades executed.
      - name: close
        data_type: numeric(18,4)
        description: >
          Closing price, computed by the venue from the last half hour rather than traded, so on a
          thin day it sits outside the day's high and low. Missing where the venue published 0.

  - name: mart_adjusted_prices
    description: >
      One bar per instrument, venue and trading day, scaled by every bonus, split and
      consolidation after it, keyed on the ISIN the instrument trades under now so the series runs
      across a change of face value. Charts and trends read this; one venue at a time, never both
      blended.
    columns:
      - name: isin
        data_type: varchar(12)
        description: The ISIN the instrument trades under now, which the whole series is keyed on.
      - name: source_isin
        data_type: varchar(12)
        description: The ISIN the bar was published under, which differs before a face value change.
      - name: venue
        data_type: varchar(12)
        description: BSE or NSE.
      - name: trade_date
        data_type: date
        description: The day the bar describes.
      - name: as_of_date
        data_type: date
        description: The day the bar became knowable.
      - name: close_as_traded
        data_type: numeric(18,4)
        description: The close the venue published, unscaled; missing where the venue published 0.
      - name: turnover
        data_type: numeric(20,2)
        description: Value traded in rupees, as published; a change in the count of shares leaves it.
      - name: adjustment_factor
        data_type: numeric
        description: The product of every factor applied after this bar.
      - name: open
        data_type: numeric
        description: The first traded price scaled by the factor.
      - name: high
        data_type: numeric
        description: The highest traded price scaled by the factor.
      - name: low
        data_type: numeric
        description: The lowest traded price scaled by the factor.
      - name: close
        data_type: numeric
        description: The close scaled by the factor; missing with the published close.
      - name: volume
        data_type: numeric
        description: Shares traded divided by the factor, since a bonus multiplies the count.
      - name: delivery_quantity
        data_type: numeric
        description: >
          Shares that settled, divided by the same factor; missing on a day the venue published no
          delivery figure for the instrument.

  - name: mart_venue_spread
    description: >
      One row per dual-listed instrument and trading day on which both venues published a close,
      with the gap between the closes. Each row is resolved from every version of both bars, so a
      read names its instruments and days. Whether a gap marks a divergence is `is_diverging` on
      mart_daily_features.
    columns:
      - name: isin
        data_type: varchar(12)
        description: The ISIN both bars were published under.
      - name: trade_date
        data_type: date
        description: The day the two closes describe.
      - name: as_of_date
        data_type: date
        description: The later of the two bars' knowable dates.
      - name: bse_close
        data_type: numeric
        description: BSE's published close, unadjusted.
      - name: nse_close
        data_type: numeric
        description: NSE's published close, unadjusted.
      - name: venue_spread_bps
        data_type: numeric
        description: The absolute gap between the closes, in basis points of their midpoint.
      - name: comparable_turnover
        data_type: numeric
        description: >
          Turnover in rupees on the venue that traded less. Below 25 lakh a close is wherever a
          trade put it, and a gap is no divergence.

  - name: mart_delivery_daily
    description: >
      The share of a day's volume that settled, per instrument, venue and trading day, where the
      venue published a delivery figure. A day without one has no row. Each row is resolved from
      every version stored, so a read names its instruments and days.
    columns:
      - name: isin
        data_type: varchar(12)
        description: The ISIN both figures were published under.
      - name: venue
        data_type: varchar(12)
        description: BSE or NSE.
      - name: trade_date
        data_type: date
        description: The day both figures describe.
      - name: volume
        data_type: bigint
        description: Shares traded, from the bhavcopy.
      - name: delivery_quantity
        data_type: bigint
        description: Shares that settled, from the delivery file.
      - name: as_of_date
        data_type: date
        description: The later of the two knowable dates, since the delivery file arrives second.
      - name: delivery_percentage
        data_type: numeric
        description: >
          Delivery as a percentage of volume, absent on a day that traded nothing. Above 100 only
          on a venue day whose delivery file counts more shares than its bhavcopy.

  - name: mart_corporate_actions
    description: >
      Each corporate action once, keyed on the ISIN the instrument trades under now. Where both
      venues report an action, BSE's record stands, as it does for the price adjustment; NSE's
      stands where BSE reports no action of that kind that day. A split of a fund's units no venue
      records is read from the prices.
    columns:
      - name: isin
        data_type: varchar(12)
        description: The ISIN the instrument trades under now.
      - name: source_isin
        data_type: varchar(12)
        description: The ISIN the action was recorded under, which differs before a face value change.
      - name: ex_date
        data_type: date
        description: The first day the shares traded without the action's entitlement.
      - name: action_type
        data_type: text
        description: >
          bonus, split, consolidation, dividend, or unhandled where the venue's text states no
          terms, such as a demerger.
      - name: qualifier
        data_type: text
        description: >
          The kind of dividend (interim, final, special, ordinary); for an unhandled action, its
          text in lower case.
      - name: source_id
        data_type: text
        description: The source whose record is shown; absent for an action read from the prices.
      - name: as_of_date
        data_type: date
        description: The day the shown record became knowable.
      - name: ratio_from
        data_type: numeric(18,6)
        description: Shares held before a bonus, split or consolidation.
      - name: ratio_to
        data_type: numeric(18,6)
        description: Shares held after it, for the same holding.
      - name: adjustment_factor
        data_type: numeric
        description: >
          The factor the action scales earlier prices by, shares before over shares after; absent
          for a dividend.
      - name: dividend_amount
        data_type: numeric(18,4)
        description: Rupees a share. 0 where the venue recorded a dividend of nothing.
      - name: purpose
        data_type: text
        description: The venue's own text for an unhandled action, the only record of what it did.
      - name: reported_by
        data_type: text
        description: BSE, NSE, both, or prices for a fund's unit split no venue records.
      - name: venues_differ
        data_type: boolean
        description: >
          Whether both venues report dividends that day and state different amounts. The shown
          amount is BSE's.
      - name: is_applied
        data_type: boolean
        description: >
          Whether the adjusted prices apply this split, bonus or consolidation. An action NSE alone
          reports is applied only where the prices confirm it. Absent for a dividend or an
          unhandled action.
      - name: terms
        data_type: text
        description: >
          The terms as an announcement states them: "1 for 1" for a bonus, "1 into 5" or "10 into
          1" for a split or consolidation, "Nil" for a dividend of nothing; absent for a paid
          dividend, whose amount is dividend_amount, and for an unhandled action.

unit_tests:
  - name: an_action_both_venues_report_is_listed_once_as_bse_records_it
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE040A01034, action_type: dividend, ex_date: "2025-06-27", qualifier: final,
             source_id: bse_corporate_actions, as_of_date: "2025-06-27", dividend_amount: 22}
          - {isin: INE040A01034, action_type: dividend, ex_date: "2025-06-27", qualifier: ordinary,
             source_id: nse_corporate_actions, as_of_date: "2025-06-27", dividend_amount: 22}
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE040A01034, current_isin: INE040A01034}
      - input: ref('int_capital_action_factors')
        rows: []
    expect:
      rows:
        - {isin: INE040A01034, qualifier: final, source_id: bse_corporate_actions,
           reported_by: both, venues_differ: false, terms: null}

  - name: dividends_the_venues_state_differently_are_marked
    description: BSE lists an interim and a special dividend that NSE files as one amount.
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE001A01036, action_type: dividend, ex_date: "2024-02-01", qualifier: interim,
             source_id: bse_corporate_actions, as_of_date: "2024-02-01", dividend_amount: 5}
          - {isin: INE001A01036, action_type: dividend, ex_date: "2024-02-01", qualifier: special,
             source_id: bse_corporate_actions, as_of_date: "2024-02-01", dividend_amount: 3}
          - {isin: INE001A01036, action_type: dividend, ex_date: "2024-02-01", qualifier: interim,
             source_id: nse_corporate_actions, as_of_date: "2024-02-01", dividend_amount: 8}
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE001A01036, current_isin: INE001A01036}
      - input: ref('int_capital_action_factors')
        rows: []
    expect:
      rows:
        - {qualifier: interim, dividend_amount: "5.0000", reported_by: both, venues_differ: true}
        - {qualifier: special, dividend_amount: "3.0000", reported_by: both, venues_differ: true}

  - name: an_nse_only_action_is_applied_where_the_prices_confirm_it
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE002A01018, action_type: bonus, ex_date: "2024-10-28", qualifier: ordinary,
             source_id: bse_corporate_actions, as_of_date: "2024-10-28", ratio_from: 1,
             ratio_to: 2, adjustment_factor: 0.5}
          - {isin: INE003A01024, action_type: bonus, ex_date: "2024-10-28", qualifier: ordinary,
             source_id: nse_corporate_actions, as_of_date: "2024-10-28", ratio_from: 1,
             ratio_to: 2, adjustment_factor: 0.5}
          - {isin: INE004A01022, action_type: bonus, ex_date: "2024-10-28", qualifier: ordinary,
             source_id: nse_corporate_actions, as_of_date: "2024-10-28", ratio_from: 1,
             ratio_to: 2, adjustment_factor: 0.5}
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE002A01018, current_isin: INE002A01018}
          - {isin: INE003A01024, current_isin: INE003A01024}
          - {isin: INE004A01022, current_isin: INE004A01022}
      - input: ref('int_capital_action_factors')
        rows:
          - {isin: INE002A01018, ex_date: "2024-10-28", basis: bse, applied_factor: 0.5}
          - {isin: INE003A01024, ex_date: "2024-10-28", basis: nse_confirmed, applied_factor: 0.5}
          - {isin: INE004A01022, ex_date: "2024-10-28", basis: nse_contradicted}
    expect:
      rows:
        - {isin: INE002A01018, reported_by: BSE, is_applied: true}
        - {isin: INE003A01024, reported_by: NSE, is_applied: true}
        - {isin: INE004A01022, reported_by: NSE, is_applied: false}

  - name: terms_read_as_an_announcement_states_them
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE005A01025, action_type: bonus, ex_date: "2024-01-02", qualifier: ordinary,
             source_id: bse_corporate_actions, ratio_from: 1, ratio_to: 2}
          - {isin: INE005A01025, action_type: bonus, ex_date: "2024-02-01", qualifier: ordinary,
             source_id: bse_corporate_actions, ratio_from: 10, ratio_to: 14}
          - {isin: INE005A01025, action_type: split, ex_date: "2024-03-01", qualifier: ordinary,
             source_id: bse_corporate_actions, ratio_from: 1, ratio_to: 2.5}
          - {isin: INE005A01025, action_type: consolidation, ex_date: "2024-04-01",
             qualifier: ordinary, source_id: nse_corporate_actions, ratio_from: 10, ratio_to: 1}
          - {isin: INE005A01025, action_type: dividend, ex_date: "2024-05-02", qualifier: ordinary,
             source_id: bse_corporate_actions, dividend_amount: 0}
          - {isin: INE005A01025, action_type: dividend, ex_date: "2024-06-03", qualifier: ordinary,
             source_id: bse_corporate_actions, dividend_amount: 22}
          - {isin: INE005A01025, action_type: unhandled, ex_date: "2024-07-01",
             qualifier: scheme of arrangement, source_id: bse_corporate_actions,
             purpose: Scheme of Arrangement}
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE005A01025, current_isin: INE005A01025}
      - input: ref('int_capital_action_factors')
        rows: []
    expect:
      rows:
        - {ex_date: "2024-01-02", terms: 1 for 1}
        - {ex_date: "2024-02-01", terms: 4 for 10}
        - {ex_date: "2024-03-01", terms: 2 into 5}
        - {ex_date: "2024-04-01", terms: 10 into 1}
        - {ex_date: "2024-05-02", terms: Nil}
        - {ex_date: "2024-06-03", terms: null}
        - {ex_date: "2024-07-01", terms: null}

  - name: a_fund_unit_split_no_venue_records_is_read_from_the_prices
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows: []
      - input: ref('int_instrument_lineage')
        rows: []
      - input: ref('int_capital_action_factors')
        rows:
          - {isin: INF000A01027, ex_date: "2019-07-15", basis: fund_unit_split,
             applied_factor: 0.1, as_of_date: "2019-07-15"}
    expect:
      rows:
        - {isin: INF000A01027, action_type: split, reported_by: prices, source_id: null,
           adjustment_factor: "0.1", is_applied: true, terms: 1 into 10}

  - name: an_action_under_a_replaced_isin_is_keyed_on_the_current_one
    model: mart_corporate_actions
    given:
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE006A01013, action_type: dividend, ex_date: "2024-08-01", qualifier: final,
             source_id: nse_corporate_actions, dividend_amount: 2}
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE006A01013, current_isin: INE006A01047}
      - input: ref('int_capital_action_factors')
        rows: []
    expect:
      rows:
        - {isin: INE006A01047, source_isin: INE006A01013, reported_by: NSE}
