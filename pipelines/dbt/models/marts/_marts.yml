             return_1d: 0.01, is_52w_high: false, is_52w_low: false}
          - {isin: INE062A01020, trade_date: "2026-10-09", as_of_date: "2026-10-09",
             return_1d: 0.02, is_52w_high: true, is_52w_low: false}
