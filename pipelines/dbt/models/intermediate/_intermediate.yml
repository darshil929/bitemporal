             close: 152.85}
          - {isin: INF740KA1ZP2, venue: BSE, trade_date: "2026-08-28", as_of_date: "2026-08-28",
             close: 15.38}
          - {isin: INF740KA1SW3, venue: NSE, trade_date: "2026-08-27", as_of_date: "2026-08-27",
