version: 2

models:
  - name: int_venue_spread
    description: >
      One row per dual-listed instrument and trading day, carrying each venue's close and the
      gap between them. Indicators run on one venue; this measures how far the other sits.
    columns:
      - name: isin
        description: Canonical instrument identifier.
        data_tests: [not_null]
      - name: trade_date
        description: The day the two closes describe.
        data_tests: [not_null]
      - name: as_of_date
        description: The later of the two bars' knowable dates.
        data_tests: [not_null]
      - name: bse_close
        description: Published BSE close, unadjusted.
        data_tests: [not_null]
      - name: nse_close
        description: Published NSE close, unadjusted.
        data_tests: [not_null]
      - name: venue_spread_bps
        description: Absolute gap between the venue closes, in basis points of their midpoint.
        data_tests: [not_null]

  - name: int_delivery_participation
    description: >
      The share of a day's volume that settled. Joins the bar to the delivery figure published
      separately for the same instrument, venue and day.
    columns:
      - name: isin
        description: Canonical instrument identifier.
        data_tests: [not_null]
      - name: venue
        description: Exchange both figures were published by.
        data_tests: [not_null]
      - name: trade_date
        description: The day both figures describe.
        data_tests: [not_null]
      - name: as_of_date
        description: The later of the two knowable dates, since the delivery file arrives second.
        data_tests: [not_null]
      - name: volume
        description: Shares traded, from the bhavcopy.
        data_tests: [not_null]
      - name: delivery_quantity
        description: Shares that settled, from the delivery file.
        data_tests: [not_null]
      - name: delivery_percentage
        description: Delivery as a percentage of volume, absent on a day that traded nothing.

unit_tests:
  - name: the_spread_is_measured_against_the_midpoint
    description: A one rupee gap on a hundred rupee midpoint is a hundred basis points.
    model: int_venue_spread
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: BSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 100.5}
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 99.5}
    expect:
      rows:
        - {isin: INE002A01018, trade_date: "2025-01-02", bse_close: "100.5000", nse_close: "99.5000",
           venue_spread_bps: "100.0000"}

  - name: an_instrument_on_one_venue_alone_has_no_spread
    description: A gap needs two closes; a single venue leaves nothing to compare.
    model: int_venue_spread
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE0QVH01025, venue: BSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 100.5}
    expect:
      rows: []

  - name: a_day_traded_round_shows_a_low_delivery_share
    description: Half a day's volume settling reads as fifty percent participation.
    model: int_delivery_participation
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", volume: 1000}
      - input: ref('stg_delivery_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", delivery_quantity: 500}
    expect:
      rows:
        - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02", volume: 1000,
           delivery_quantity: 500, delivery_percentage: "50.0000"}

  - name: a_bar_with_no_delivery_figure_is_left_out
    description: The delivery file arrives separately and sometimes not at all.
    model: int_delivery_participation
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", volume: 1000}
      - input: ref('stg_delivery_daily')
        rows: []
    expect:
      rows: []
