version: 2

models:
  - name: int_venue_spread
    description: >
      One row per dual-listed instrument and trading day on which both venues published a close,
      carrying each venue's close and the gap between them. Indicators run on one venue; this
      measures how far the other sits.
    columns:
      - name: isin
        description: Canonical instrument identifier.
        data_tests: [not_null]
      - name: trade_date
        description: The day the two closes describe.
        data_tests: [not_null]
      - name: as_of_date
        description: The later of the two bars' knowable dates.
        data_tests: [not_null]
      - name: bse_close
        description: Published BSE close, unadjusted.
        data_tests: [not_null]
      - name: nse_close
        description: Published NSE close, unadjusted.
        data_tests: [not_null]
      - name: venue_spread_bps
        description: Absolute gap between the venue closes, in basis points of their midpoint.
        data_tests: [not_null]
      - name: comparable_turnover
        description: >
          Turnover on the venue that traded less. A gap is read only where this is large enough
          for the two prices to be held together; below it a close is wherever a trade put it.

  - name: int_delivery_participation
    description: >
      The share of a day's volume that settled. Joins the bar to the delivery figure published
      separately for the same instrument, venue and day.
    columns:
      - name: isin
        description: Canonical instrument identifier.
        data_tests: [not_null]
      - name: venue
        description: Exchange both figures were published by.
        data_tests: [not_null]
      - name: trade_date
        description: The day both figures describe.
        data_tests: [not_null]
      - name: as_of_date
        description: The later of the two knowable dates, since the delivery file arrives second.
        data_tests: [not_null]
      - name: volume
        description: Shares traded, from the bhavcopy.
        data_tests: [not_null]
      - name: delivery_quantity
        description: Shares that settled, from the delivery file.
        data_tests: [not_null]
      - name: delivery_percentage
        description: Delivery as a percentage of volume, absent on a day that traded nothing.

  - name: int_instrument_lineage
    description: >
      Every ISIN mapped to the one it trades under now. An instrument that never changed face
      value maps to itself, so a join through this model never drops a row.
    columns:
      - name: isin
        description: An ISIN the instrument has traded under at some point.
        data_tests: [not_null, unique]
      - name: current_isin
        description: The ISIN it trades under now, after every change of face value.
        data_tests: [not_null]

  - name: int_instrument_display_names
    description: >
      The name each instrument is shown under, one row per instrument: BSE's list of scrips, then
      NSE's lists of equities, then either list's name for the ISIN the instrument trades under
      now, then the name its venue's price file printed.
    columns:
      - name: isin
        description: Canonical instrument identifier.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_instruments')
                field: isin
      - name: display_name
        description: The name to show, BSE's trailing "-$" marker removed.
        data_tests: [not_null]
      - name: named_by
        description: Where the name comes from, a list's source id or the venue's price file.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bse_scrip_list, nse_equity_list, price_file]
      - name: named_isin
        description: >
          The ISIN the name was given to: the instrument's own, or the one it trades under now
          where no list names a superseded ISIN.
        data_tests: [not_null]
      - name: as_of_date
        description: The day the list giving the name was read, absent where the price file names it.

  - name: int_continuous_prices
    description: >
      A price series that spans a change of face value, keyed on the ISIN the instrument trades
      under now and scaled by every factor int_capital_action_factors applies after each bar. A split issues a new ISIN
      holding no earlier bars, so a series read from stg_price_daily alone stops at the split.
    columns:
      - name: isin
        description: The ISIN the instrument trades under now, which the whole series is keyed on.
        data_tests: [not_null]
      - name: source_isin
        description: The ISIN the bar was published under, which differs before a face value change.
        data_tests: [not_null]
      - name: venue
        description: Exchange the bar was published by.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [BSE, NSE]
      - name: trade_date
        description: The day the bar describes.
        data_tests: [not_null]
      - name: as_of_date
        description: The day the bar became knowable.
        data_tests: [not_null]
      - name: close_as_traded
        description: >
          The close the venue published, carrying no adjustment; missing where the venue published
          0.
      - name: adjustment_factor
        description: Product of every factor applied after this bar.
        data_tests: [not_null]
      - name: close
        description: >
          The close scaled by that factor, which is what a series is drawn from; missing with the
          published close.
      - name: volume
        description: Shares traded, divided by the factor, since a bonus multiplies the count.
        data_tests: [not_null]
      - name: delivery_quantity
        description: >
          Shares that settled, divided by the same factor as volume. Null on a day the venue
          published no delivery figure for the instrument.
      - name: turnover
        description: >
          Value traded in rupees, as published. A change in the count of shares leaves a value
          unchanged, so no factor applies.

  - name: int_capital_action_factors
    description: >
      Each day either venue reports a split, bonus or consolidation, or a fund's units change ISIN,
      with the factor each venue's actions apply and the factor the continuous series applies.
      BSE's actions stand; a day NSE alone reports is applied where the close moved by its factor at
      every venue that traded either side of the ex-date; a fund's change of ISIN no venue reports
      is applied where every venue that traded across it moved by the same face value ratio.
    columns:
      - name: isin
        description: The ISIN the instrument trades under now.
        data_tests: [not_null]
      - name: ex_date
        description: The day the actions take effect.
        data_tests: [not_null]
      - name: bse_factor
        description: The product of the factors of BSE's actions that day, null when it reports none.
      - name: nse_factor
        description: The product of the factors of NSE's actions that day, null when it reports none.
      - name: venues_traded
        description: >
          Venues that traded within the window either side of a day NSE alone reports, or across a
          fund's change of ISIN, whose move is measured. Zero on a day BSE reports.
        data_tests: [not_null]
      - name: venues_confirming
        description: >
          Venues among those whose move lies within tolerance of NSE's factor, or of a face value
          ratio for a fund.
        data_tests: [not_null]
      - name: basis
        description: >
          Why the factor is or is not applied: BSE reports the day; NSE alone reports it and every
          venue that traded confirms it; a venue that traded moved otherwise; none traded; or a
          fund's units were split across a change of ISIN no venue reports.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bse, nse_confirmed, nse_contradicted, nse_untraded, fund_unit_split]
      - name: applied_factor
        description: The factor the continuous series applies that day, null where none is applied.
      - name: as_of_date
        description: The latest day on which the report and the prices deciding it were knowable.
        data_tests: [not_null]

  - name: int_corporate_action_agreement
    description: >
      Each day BSE or NSE reports a split, bonus or consolidation for an instrument listed at both
      venues, with the factor each venue's actions apply that day.
    columns:
      - name: isin
        description: The ISIN the instrument trades under now.
        data_tests: [not_null]
      - name: ex_date
        description: The day the actions take effect.
        data_tests: [not_null]
      - name: bse_factor
        description: The product of the factors of BSE's actions that day, null when it reports none.
      - name: nse_factor
        description: The product of the factors of NSE's actions that day, null when it reports none.
      - name: as_of_date
        description: The latest day on which the actions compared became knowable.
        data_tests: [not_null]
      - name: agreement
        description: Whether both venues report the day and apply the same factor.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [agree, differ, bse_only, nse_only]

unit_tests:
  - name: the_spread_is_measured_against_the_midpoint
    description: A one rupee gap on a hundred rupee midpoint is a hundred basis points.
    model: int_venue_spread
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: BSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 100.5}
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 99.5}
    expect:
      rows:
        - {isin: INE002A01018, trade_date: "2025-01-02", bse_close: "100.5000", nse_close: "99.5000",
           venue_spread_bps: "100.0000"}

  - name: an_instrument_on_one_venue_alone_has_no_spread
    description: A gap needs two closes; a single venue leaves nothing to compare.
    model: int_venue_spread
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE0QVH01025, venue: BSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", close: 100.5}
    expect:
      rows: []

  - name: a_day_traded_round_shows_a_low_delivery_share
    description: Half a day's volume settling reads as fifty percent participation.
    model: int_delivery_participation
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", volume: 1000}
      - input: ref('stg_delivery_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", delivery_quantity: 500}
    expect:
      rows:
        - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02", volume: 1000,
           delivery_quantity: 500, delivery_percentage: "50.0000"}

  - name: a_bar_with_no_delivery_figure_is_left_out
    description: The delivery file arrives separately and sometimes not at all.
    model: int_delivery_participation
    given:
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE002A01018, venue: NSE, trade_date: "2025-01-02",
             as_of_date: "2025-01-02", volume: 1000}
      - input: ref('stg_delivery_daily')
        rows: []
    expect:
      rows: []

  - name: an_instrument_that_never_split_maps_to_itself
    description: Joining through the lineage must not drop an instrument with no succession.
    model: int_instrument_lineage
    given:
      - input: ref('stg_instruments')
        rows:
          - {isin: INE002A01018}
          - {isin: INE721A01013}
          - {isin: INE721A01047}
      - input: ref('stg_successions')
        rows:
          - {predecessor_isin: INE721A01013, successor_isin: INE721A01047,
             changed_on: "2025-01-10"}
    expect:
      rows:
        - {isin: INE002A01018, current_isin: INE002A01018}
        - {isin: INE721A01013, current_isin: INE721A01047}
        - {isin: INE721A01047, current_isin: INE721A01047}

  - name: a_second_change_of_face_value_carries_the_lineage_further
    description: An ISIN that split twice maps to the last one, not the middle one.
    model: int_instrument_lineage
    given:
      - input: ref('stg_instruments')
        rows:
          - {isin: INE000A01011}
          - {isin: INE000A01029}
          - {isin: INE000A01037}
      - input: ref('stg_successions')
        rows:
          - {predecessor_isin: INE000A01011, successor_isin: INE000A01029,
             changed_on: "2024-06-03"}
          - {predecessor_isin: INE000A01029, successor_isin: INE000A01037,
             changed_on: "2025-06-03"}
    expect:
      rows:
        - {isin: INE000A01011, current_isin: INE000A01037}
        - {isin: INE000A01029, current_isin: INE000A01037}
        - {isin: INE000A01037, current_isin: INE000A01037}

  - name: a_predecessor_bar_is_scaled_by_the_split_that_replaced_its_isin
    description: >
      The action sits under the successor, and the bar under the predecessor. Without the
      lineage between them a one for five split reads as an eighty percent fall.
    model: int_continuous_prices
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE721A01013, current_isin: INE721A01047}
          - {isin: INE721A01047, current_isin: INE721A01047}
      - input: ref('int_capital_action_factors')
        rows:
          - {isin: INE721A01047, ex_date: "2025-01-10", applied_factor: 0.2}
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE721A01013, venue: NSE, trade_date: "2025-01-09",
             as_of_date: "2025-01-09", open: 2800, high: 2820, low: 2790, close: 2809.85,
             volume: 1000, turnover: 2809850}
          - {isin: INE721A01047, venue: NSE, trade_date: "2025-01-10",
             as_of_date: "2025-01-10", open: 560, high: 565, low: 530, close: 532,
             volume: 5000, turnover: 2660000}
      - input: ref('stg_delivery_daily')
        rows:
          - {isin: INE721A01013, venue: NSE, trade_date: "2025-01-09",
             as_of_date: "2025-01-09", delivery_quantity: 400}
    expect:
      rows:
        - {isin: INE721A01047, source_isin: INE721A01013, venue: NSE,
           trade_date: "2025-01-09", adjustment_factor: "0.2000000000",
           close_as_traded: "2809.85", close: "561.9700", volume: "5000",
           delivery_quantity: "2000", turnover: "2809850.00"}
        - {isin: INE721A01047, source_isin: INE721A01047, venue: NSE,
           trade_date: "2025-01-10", adjustment_factor: "1", close_as_traded: "532",
           close: "532.0000", volume: "5000", delivery_quantity: null, turnover: "2660000.00"}

  - name: a_bar_carries_the_product_of_the_actions_still_ahead_of_it
    description: >
      HDFC Bank split one for two on 2019-09-19 and issued a one for one bonus on 2025-08-26. A
      bar before both carries a quarter, one between them a half, and one after both nothing.
    model: int_continuous_prices
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE040A01026, current_isin: INE040A01034}
          - {isin: INE040A01034, current_isin: INE040A01034}
      - input: ref('int_capital_action_factors')
        rows:
          - {isin: INE040A01034, ex_date: "2019-09-19", applied_factor: 0.5}
          - {isin: INE040A01034, ex_date: "2025-08-26", applied_factor: 0.5}
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE040A01026, venue: NSE, trade_date: "2019-09-18", as_of_date: "2019-09-18",
             close: 2187.75, volume: 100}
          - {isin: INE040A01034, venue: NSE, trade_date: "2025-08-25", as_of_date: "2025-08-25",
             close: 1964.10, volume: 100}
          - {isin: INE040A01034, venue: NSE, trade_date: "2025-08-26", as_of_date: "2025-08-26",
             close: 973.40, volume: 100}
      - input: ref('stg_delivery_daily')
        rows: []
    expect:
      rows:
        - {isin: INE040A01034, trade_date: "2019-09-18", adjustment_factor: "0.2500000000",
           close: "546.9375"}
        - {isin: INE040A01034, trade_date: "2025-08-25", adjustment_factor: "0.5000000000",
           close: "982.0500"}
        - {isin: INE040A01034, trade_date: "2025-08-26", adjustment_factor: "1", close: "973.4000"}

  - name: a_day_with_no_applied_factor_leaves_the_series_unscaled
    description: >
      NSE's bonus for IGARASHI on 2018-09-27 is one the prices contradict, so it scales nothing.
    model: int_continuous_prices
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE188B01013, current_isin: INE188B01013}
      - input: ref('int_capital_action_factors')
        rows:
          - {isin: INE188B01013, ex_date: "2018-09-27", applied_factor: null}
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE188B01013, venue: NSE, trade_date: "2018-09-26", as_of_date: "2018-09-26",
             open: 710, high: 712, low: 700, close: 703.15, volume: 100}
      - input: ref('stg_delivery_daily')
        rows: []
    expect:
      rows:
        - {isin: INE188B01013, trade_date: "2018-09-26", adjustment_factor: "1",
           close: "703.1500"}

  - name: a_day_bse_reports_applies_its_factor_whatever_nse_files
    description: >
      Bajaj Finance split one for two and issued a four for one bonus on 2025-06-16. BSE files
      both and NSE the bonus alone, and BSE's actions stand.
    model: int_capital_action_factors
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE296A01032, current_isin: INE296A01032}
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE296A01032, source_id: bse_corporate_actions, action_type: split,
             ex_date: "2025-06-16", qualifier: ordinary, adjustment_factor: 0.5,
             as_of_date: "2026-09-26"}
          - {isin: INE296A01032, source_id: bse_corporate_actions, action_type: bonus,
             ex_date: "2025-06-16", qualifier: ordinary, adjustment_factor: 0.2,
             as_of_date: "2026-09-26"}
          - {isin: INE296A01032, source_id: nse_corporate_actions, action_type: bonus,
             ex_date: "2025-06-16", qualifier: ordinary, adjustment_factor: 0.2,
             as_of_date: "2026-09-26"}
      - input: ref('stg_successions')
        rows: []
      - input: ref('stg_price_daily')
        rows: []
    expect:
      rows:
        - {isin: INE296A01032, ex_date: "2025-06-16", bse_factor: "0.1000000000",
           nse_factor: "0.2000000000", basis: bse, applied_factor: "0.1000000000"}

  - name: an_nse_only_bonus_is_applied_where_both_venues_confirm_it
    description: >
      GRUH Finance issued a one for one bonus on 2018-06-06 that BSE never recorded. The close
      halved at both venues.
    model: int_capital_action_factors
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE580B01029, current_isin: INE580B01029}
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE580B01029, source_id: nse_corporate_actions, action_type: bonus,
             ex_date: "2018-06-06", qualifier: ordinary, adjustment_factor: 0.5,
             as_of_date: "2026-09-26"}
      - input: ref('stg_successions')
        rows: []
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE580B01029, venue: BSE, trade_date: "2018-06-05", as_of_date: "2018-06-05",
             close: 681.35}
          - {isin: INE580B01029, venue: BSE, trade_date: "2018-06-06", as_of_date: "2018-06-06",
             close: 356.95}
          - {isin: INE580B01029, venue: NSE, trade_date: "2018-06-05", as_of_date: "2018-06-05",
             close: 681.80}
          - {isin: INE580B01029, venue: NSE, trade_date: "2018-06-06", as_of_date: "2018-06-06",
             close: 356.85}
    expect:
      rows:
        - {isin: INE580B01029, ex_date: "2018-06-06", venues_traded: 2, venues_confirming: 2,
           basis: nse_confirmed, applied_factor: "0.5000000000", as_of_date: "2026-09-26"}

  - name: a_bonus_the_prices_contradict_is_not_applied
    description: >
      NSE's terms for IGARASHI's 2018-09-27 bonus scale the price by 0.89. The close moved by
      under three percent at both venues.
    model: int_capital_action_factors
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE188B01013, current_isin: INE188B01013}
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE188B01013, source_id: nse_corporate_actions, action_type: bonus,
             ex_date: "2018-09-27", qualifier: ordinary, adjustment_factor: 0.889868,
             as_of_date: "2026-09-26"}
      - input: ref('stg_successions')
        rows: []
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE188B01013, venue: BSE, trade_date: "2018-09-26", as_of_date: "2018-09-26",
             close: 700.90}
          - {isin: INE188B01013, venue: BSE, trade_date: "2018-09-27", as_of_date: "2018-09-27",
             close: 682.60}
          - {isin: INE188B01013, venue: NSE, trade_date: "2018-09-26", as_of_date: "2018-09-26",
             close: 703.15}
          - {isin: INE188B01013, venue: NSE, trade_date: "2018-09-27", as_of_date: "2018-09-27",
             close: 688.45}
    expect:
      rows:
        - {isin: INE188B01013, ex_date: "2018-09-27", venues_traded: 2, venues_confirming: 0,
           basis: nse_contradicted, applied_factor: null}

  - name: a_small_bonus_is_confirmed_by_a_move_past_half_its_step
    description: >
      Infinite Computer Solutions issued one share for every 26 on 2017-11-01, a step of under
      four percent, and closed three percent lower at BSE and two and a half at NSE.
    model: int_capital_action_factors
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE486J01014, current_isin: INE486J01014}
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE486J01014, source_id: nse_corporate_actions, action_type: bonus,
             ex_date: "2017-11-01", qualifier: ordinary, adjustment_factor: 0.962963,
             as_of_date: "2026-09-26"}
      - input: ref('stg_successions')
        rows: []
      - input: ref('stg_price_daily')
        rows:
          - {isin: INE486J01014, venue: BSE, trade_date: "2017-10-31", as_of_date: "2017-10-31",
             close: 231.05}
          - {isin: INE486J01014, venue: BSE, trade_date: "2017-11-01", as_of_date: "2017-11-01",
             close: 223.40}
          - {isin: INE486J01014, venue: NSE, trade_date: "2017-10-31", as_of_date: "2017-10-31",
             close: 230.70}
          - {isin: INE486J01014, venue: NSE, trade_date: "2017-11-01", as_of_date: "2017-11-01",
             close: 224.90}
    expect:
      rows:
        - {isin: INE486J01014, ex_date: "2017-11-01", venues_confirming: 2,
           basis: nse_confirmed, applied_factor: "0.9629630000"}

  - name: a_bonus_no_venue_traded_across_is_not_applied
    description: >
      Mohota Industries last traded on 2014-02-04 before its bonus of 2014-02-06. With no trade
      recorded after it, no move measures it.
    model: int_capital_action_factors
    given:
      - input: ref('int_instrument_lineage')
        rows:
          - {isin: INE313D01013, current_isin: INE313D01013}
      - input: ref('stg_corporate_actions')
        rows:
          - {isin: INE313D01013, source_id: nse_corporate_actions, action_type: bonus,
             ex_date: "2014-02-06", qualifier: ordinary, adjustment_factor: 0.333333,
