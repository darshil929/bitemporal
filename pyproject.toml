[project]
name = "bitemporal"
version = "0.0.0"
description = "Personal equity analysis platform for Indian, US and UK markets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitemporal-api",
    "bitemporal-pipelines",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["api", "pipelines"]

[tool.uv.sources]
bitemporal-api = { workspace = true }
bitemporal-pipelines = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=2.3.0",
    "pytest>=8.3",
    "ruff>=0.16.1",
    "sqlfluff>=4.2.2",
]

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipelines/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "btcore", "pipelines"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["api/src", "pipelines/src"]
explicit_package_bases = true
