name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS: native
        with:
          package-dir: engine
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          retention-days: 7
