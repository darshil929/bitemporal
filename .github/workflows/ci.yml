name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  detect-changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # A private repository lists a pull request's files only to a token that reads pull requests.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      python: ${{ steps.filter.outputs.python }}
      dbt: ${{ steps.filter.outputs.dbt }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'Makefile'
            engine:
              - *shared
              - 'engine/**'
            python:
              - *shared
              - 'api/**'
              - 'engine/**'
              - 'pipelines/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
            dbt:
              - *shared
              - 'pipelines/dbt/**'
            web:
              - *shared
              - 'web/**'

  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # uv sync compiles the engine, with the GCC its Linux leg is checked against.
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: npm --prefix web ci
      - run: make lint

  engine-test:
    name: engine-test (${{ matrix.leg }})
    needs: detect-changes
    if: needs.detect-changes.outputs.engine == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: apple-clang
            runner: xcode-27
          - leg: address
            runner: xcode-27
            sanitizer: address
          - leg: undefined
            runner: xcode-27
            sanitizer: undefined
          - leg: thread
            runner: xcode-27
            sanitizer: thread
          # The Docker images build the engine with Debian's GCC and libstdc++.
          - leg: gcc
            runner: ubuntu-24.04-arm
            compiler: g++-14
    env:
      SANITIZER: ${{ matrix.sanitizer }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
    steps:
      - uses: actions/checkout@v7

      # macOS images ship GNU Make 3.81, which the Makefile rejects.
      - name: Install build tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # vcpkg runs the system CMake and Ninja on arm64 Linux, and its port scripts need CMake 4,
      # where the image carries 3.31.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pipx install "cmake>=4,<5"
          echo "$(pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"
          echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Read vcpkg baseline
        id: vcpkg
        run: echo "baseline=$(jq -r '."builtin-baseline"' engine/vcpkg.json)" >> "$GITHUB_OUTPUT"

      # A shallow clone resolves a builtin-baseline only when it is the clone's HEAD. Built packages
      # are cached as archives, which every build folder installs from.
      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.runner }}-${{ matrix.compiler || 'apple-clang' }}-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('engine/vcpkg.json') }}

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "${{ steps.vcpkg.outputs.baseline }}"
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: engine-${{ matrix.leg }}

      # The default build also tests the Python bindings, in an environment uv builds for them.
      - uses: astral-sh/setup-uv@v9.0.0
        if: ${{ !matrix.sanitizer }}
        with:
          enable-cache: true
          cache-dependency-glob: engine/pyproject.toml

      - run: make test-engine

  # The change and its base are built and measured on one runner, alternating, so a busy machine
  # slows both alike.
  engine-bench:
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.engine == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    # Reads the pull request's labels.
    permissions:
      contents: read
      pull-requests: read
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          brew install ninja make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Read vcpkg baseline
        id: vcpkg
        run: echo "baseline=$(jq -r '."builtin-baseline"' engine/vcpkg.json)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-xcode-27-apple-clang-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('engine/vcpkg.json') }}

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "${{ steps.vcpkg.outputs.baseline }}"
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: engine-bench

      - name: Build the change and its base
        run: |
          git fetch --depth 1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
          make bench-engine BENCH_ARGS=--benchmark_list_tests
          if grep -q '^bench-engine:' "$RUNNER_TEMP/base/Makefile"; then
            make -C "$RUNNER_TEMP/base" bench-engine BENCH_ARGS=--benchmark_list_tests
          else
            touch no-base
          fi

      # One thread's time is held to the base; eight threads' on a shared runner vary too widely to
      # hold. A pull request labelled expected-slowdown is reported and not held.
      - name: Compare benchmarks with the base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -e no-base ]; then
            echo "The base branch holds no engine benchmarks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for round in 1 2 3 4 5; do
            "$RUNNER_TEMP/base/build/engine/tests/btcore_benchmarks" --benchmark_out="base-$round.json" > /dev/null
            build/engine/tests/btcore_benchmarks --benchmark_out="change-$round.json" > /dev/null
          done
          hold=--fail
          if gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx expected-slowdown; then
            hold=
            echo "Labelled expected-slowdown: reported, not held to the base." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/compare_benchmarks.py --base base-*.json --change change-*.json $hold --threshold 0.40 --gated '/1/' | tee -a "$GITHUB_STEP_SUMMARY"

  python-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: make test-python

  dbt-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dbt == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # The models read a hypertable, so the service image is the one the stack runs.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: bitemporal
          POSTGRES_USER: bitemporal
          POSTGRES_PASSWORD: bitemporal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitemporal -d bitemporal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CXX: g++-14
      DATABASE_URL: postgresql+psycopg://bitemporal:bitemporal@localhost:5432/bitemporal
      DATA_ENV: fixture
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bitemporal
      POSTGRES_PASSWORD: bitemporal
      POSTGRES_DB: bitemporal
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: make seed
      - run: make test-dbt

  web-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make test-web

  ci-ok:
    if: always()
    needs: [detect-changes, lint, engine-test, engine-bench, python-test, dbt-check, web-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      # A skipped job is a job whose paths were untouched, which is a pass. Only failure,
      # cancellation and a job that never ran because of an upstream failure are fatal.
      - name: Check dependency results
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "a required job failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "a required job was cancelled"
            exit 1
          fi
